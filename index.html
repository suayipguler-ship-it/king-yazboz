<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1220">
<title>King Yaz-Boz</title>
<style>
:root{
  --bg:#0b1220;--card:#1e293b;--card2:#263449;--line:#3b4a60;
  --text:#f8fafc;--muted:#a8b3c2;--green:#22c55e;--red:#fb7185;
  --blue:#2563eb;--gold:#f59e0b;
}
*{box-sizing:border-box}
body{
  margin:0;background:linear-gradient(180deg,#09101d,#111827);
  color:var(--text);font-family:system-ui,-apple-system,sans-serif;
}
.app{max-width:720px;margin:auto;padding:14px 12px 45px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:22px;margin:0}
h2{font-size:17px;margin:0 0 12px}
.sub{font-size:12px;color:var(--muted)}
button{border:0;border-radius:12px;padding:10px 14px;font-weight:700;color:#fff;background:#334155;cursor:pointer}
button:active{transform:scale(.98)}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:var(--blue)}
.danger{background:#991b1b}
.ghost{background:transparent;border:1px solid #506078}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.player{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-size:26px;font-weight:900;margin-top:2px}
.pos{color:var(--green)}
.neg{color:var(--red)}
.panel{background:rgba(30,41,59,.95);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.status{display:flex;justify-content:space-between;align-items:center}
.progress{height:8px;background:#0f172a;border-radius:10px;overflow:hidden;margin:8px 0}
.progress>div{height:100%;background:var(--green);width:0;transition:width .2s}
.gamegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gamebtn{min-height:54px;background:var(--card2);text-align:left;position:relative}
.gamebtn small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
.gamebtn .badge{position:absolute;right:8px;top:8px;font-size:11px;background:#0f172a;padding:2px 6px;border-radius:6px}
.chartWrap{overflow-x:auto}
.chart{width:100%;min-width:540px;border-collapse:collapse;font-size:12px}
.chart th,.chart td{padding:8px 6px;border-bottom:1px solid #334155;text-align:center}
.chart th{background:#0f172a;color:#cbd5e1}
.modal{position:fixed;inset:0;background:rgba(2,6,23,.85);display:flex;align-items:flex-end;justify-content:center;padding:10px;z-index:10}
.modalbox{width:min(680px,100%);max-height:90vh;overflow:auto;background:#172033;border:1px solid #506078;border-radius:20px;padding:16px}
.hidden{display:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}
.counter{display:flex;align-items:center;gap:6px}
.counter button{width:36px;height:36px;padding:0;font-size:18px}
.num{width:30px;text-align:center;font-weight:800;font-size:16px}
input{width:100%;padding:10px;border-radius:8px;border:1px solid #506078;background:#0f172a;color:#fff}
.actions{display:flex;gap:8px;margin-top:14px}
.actions button{flex:1}
.warn,.ok{padding:8px;border-radius:8px;margin-top:8px;font-size:12px}
.warn{background:#451a1a;color:#fca5a5}
.ok{background:#143823;color:#86efac}
.detailrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #334155}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <div>
      <h1>🃏 KING YAZ-BOZ</h1>
      <div class="sub">4 Kişilik (8 Koz + 12 Ceza Takibi)</div>
    </div>
    <button class="ghost" onclick="settings()">⚙️ Ayarlar</button>
  </div>

  <div class="panel" style="margin-top:0">
    <div class="status">
      <b>Oyun İlerlemesi</b>
      <span id="progressText" class="sub">0/20 oyun</span>
    </div>
    <div class="progress"><div id="progressBar"></div></div>
    <div id="balance" class="sub"></div>
  </div>

  <div id="players" class="grid"></div>

  <div class="panel">
    <h2>El Ekle</h2>
    <div id="gameGrid" class="gamegrid"></div>
  </div>

  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>📋 20 El Çizelgesi</h2>
      <button class="danger" onclick="newGame()">Sıfırla</button>
    </div>
    <div class="chartWrap">
      <table class="chart">
        <thead>
          <tr>
            <th>#</th>
            <th style="text-align:left">Oyun</th>
            <th id="th0">O1</th><th id="th1">O2</th><th id="th2">O3</th><th id="th3">O4</th>
            <th>Sil</th>
          </tr>
        </thead>
        <tbody id="chartBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="modalbox" id="modalbox"></div>
</div>

<script>
const DEFAULTS = {
  spade: 50, heart: 50, diamond: 50, club: 50,
  trickless: 50, hearts: 30, queens: 100, men: 60, last2: 180, rifki: 320
};

// [Başlık, El Başına Hedef, Toplam Oynanma Limiti]
const META = {
  spade: ['♠️ Maça Koz', 13, 2],
  heart: ['♥️ Kupa Koz', 13, 2],
  diamond: ['♦️ Karo Koz', 13, 2],
  club: ['♣️ Sinek Koz', 13, 2],
  trickless: ['🚫 El Almaz', 13, 2],
  hearts: ['♥️ Kupa Almaz', 13, 2],
  queens: ['👸 Kız Almaz', 4, 2],
  men: ['🤵 Erkek Almaz', 8, 2],
  last2: ['2️⃣ Son İki', 2, 2],
  rifki: ['♥️ Rıfkı', 1, 2]
};

const NEG = ['trickless', 'hearts', 'queens', 'men', 'last2', 'rifki'];

let state = JSON.parse(localStorage.getItem('kingState_v2')) || {
  names: ['Oyuncu 1', 'Oyuncu 2', 'Oyuncu 3', 'Oyuncu 4'],
  scores: [0, 0, 0, 0],
  history: [],
  rates: { ...DEFAULTS }
};

function save() {
  localStorage.setItem('kingState_v2', JSON.stringify(state));
  render();
}

function esc(str) {
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function getGameUsage(type) {
  return state.history.filter(h => h.type === type).length;
}

function render() {
  // Oyuncu Kartları
  document.getElementById('players').innerHTML = state.names.map((name, i) => `
    <div class="player" onclick="detail(${i})">
      <div class="name">${esc(name)}</div>
      <div class="score ${state.scores[i] >= 0 ? 'pos' : 'neg'}">
        ${state.scores[i] > 0 ? '+' : ''}${state.scores[i]}
      </div>
      <div class="sub">Detay için tıkla</div>
    </div>
  `).join('');

  // Sayaç ve Bar
  const count = state.history.length;
  document.getElementById('progressText').textContent = `${count}/20 oyun`;
  document.getElementById('progressBar').style.width = Math.min(100, (count / 20) * 100) + '%';

  // Masa Toplamı
  const total = state.scores.reduce((a, b) => a + b, 0);
  document.getElementById('balance').innerHTML = total === 0
    ? '<span class="pos">✓ Puan dengesi tam (0)</span>'
    : `<span class="warn">⚠️ Masa genel toplamı: ${total > 0 ? '+' : ''}${total} (0 olmalı)</span>`;

  // Butonlar ve Kalan Haklar
  document.getElementById('gameGrid').innerHTML = Object.keys(META).map(key => {
    const used = getGameUsage(key);
    const limit = META[key][2];
    const isFull = used >= limit || count >= 20;
    return `
      <button class="gamebtn" ${isFull ? 'disabled' : ''} onclick="openGame('${key}')">
        <span class="badge">${used}/${limit}</span>
        ${META[key][0]}
        <small>${NEG.includes(key) ? '-' : '+'}${state.rates[key]} / ${key === 'rifki' ? 'tek' : 'el'}</small>
      </button>
    `;
  }).join('');

  // Çizelge Başlıkları
  for (let i = 0; i < 4; i++) document.getElementById('th' + i).textContent = state.names[i];

  renderChart();
}

function renderChart() {
  let html = '';
  for (let i = 0; i < 20; i++) {
    const item = state.history[i];
    if (item) {
      html += `<tr>
        <td><b>${i + 1}</b></td>
        <td style="text-align:left">${esc(item.label)}</td>
        ${item.points.map(p => `<td class="${p < 0 ? 'neg' : 'pos'}">${p > 0 ? '+' : ''}${p}</td>`).join('')}
        <td><button class="ghost" style="padding:2px 8px" onclick="undo(${i})">↩</button></td>
      </tr>`;
    } else {
      html += `<tr>
        <td>${i + 1}</td>
        <td style="text-align:left;color:#475569">— Boş —</td>
        <td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>
      </tr>`;
    }
  }
  document.getElementById('chartBody').innerHTML = html;
}

function openGame(type) {
  window._type = type;
  window._vals = [0, 0, 0, 0];
  const [label, total] = META[type];
  const isCheckbox = ['rifki', 'last2'].includes(type);

  document.getElementById('modalbox').innerHTML = `
    <h2>${label}</h2>
    <div class="sub">${isCheckbox ? (type === 'rifki' ? 'Rıfkı’yı yiyen 1 kişiyi seçin.' : 'Son 2 eli alanları seçin (2 seçim).') : `Toplam el sayısı: ${total}`}</div>
    <div id="entry" style="margin-top:12px">
      ${state.names.map((name, i) => `
        <div class="row">
          <b>${esc(name)}</b>
          ${isCheckbox 
            ? `<input type="checkbox" id="pick${i}" onchange="validateModal()" style="width:22px;height:22px">`
            : `<div class="counter">
                <button onclick="changeCounter(${i}, -1, ${total})">−</button>
                <div class="num" id="v${i}">0</div>
                <button onclick="changeCounter(${i}, 1, ${total})">+</button>
               </div>`}
        </div>
      `).join('')}
    </div>
    <div id="modalMsg"></div>
    <div class="actions">
      <button class="ghost" onclick="closeModal()">Vazgeç</button>
      <button class="primary" id="saveBtn" disabled onclick="commitGame('${type}')">Kaydet</button>
    </div>
  `;

  validateModal();
  document.getElementById('modal').classList.remove('hidden');
}

function changeCounter(index, delta, max) {
  window._vals[index] = Math.max(0, Math.min(max, window._vals[index] + delta));
  document.getElementById('v' + index).textContent = window._vals[index];
  validateModal();
}

function validateModal() {
  const type = window._type;
  const total = META[type][1];
  let ok = false;
  let msg = '';

  if (type === 'rifki') {
    const c = [0,1,2,3].filter(i => document.getElementById('pick' + i)?.checked).length;
    ok = (c === 1);
    msg = ok ? '<div class="ok">✓ 1 oyuncu seçildi.</div>' : '<div class="warn">⚠️ Tam 1 oyuncu seçmelisiniz.</div>';
  } else if (type === 'last2') {
    const c = [0,1,2,3].filter(i => document.getElementById('pick' + i)?.checked).length;
    ok = (c === 2);
    msg = ok ? '<div class="ok">✓ 2 el dağıtıldı.</div>' : '<div class="warn">⚠️ Tam 2 seçim yapılmalıdır.</div>';
  } else {
    const sum = window._vals.reduce((a, b) => a + b, 0);
    ok = (sum === total);
    msg = ok ? `<div class="ok">✓ Toplam ${sum}/${total} el tamam.</div>` : `<div class="warn">⚠️ Toplam: ${sum} / ${total} olmalı.</div>`;
  }

  document.getElementById('modalMsg').innerHTML = msg;
  document.getElementById('saveBtn').disabled = !ok;
}

function commitGame(type) {
  const points = [0, 0, 0, 0];
  const rate = state.rates[type];

  if (type === 'rifki') {
    for (let i = 0; i < 4; i++) {
      if (document.getElementById('pick' + i).checked) points[i] = -rate;
    }
  } else if (type === 'last2') {
    for (let i = 0; i < 4; i++) {
      if (document.getElementById('pick' + i).checked) points[i] -= rate;
    }
  } else {
    const sign = NEG.includes(type) ? -1 : 1;
    for (let i = 0; i < 4; i++) {
      points[i] = window._vals[i] * rate * sign;
    }
  }

  state.scores = state.scores.map((s, i) => s + points[i]);
  state.history.push({ label: META[type][0], points, type });
  save();
  closeModal();

  if (state.history.length === 20) setTimeout(finishScreen, 200);
}

function undo(index) {
  if (!confirm('Bu eli silmek istediğinize emin misiniz?')) return;
  const removed = state.history.splice(index, 1)[0];
  state.scores = state.scores.map((s, i) => s - removed.points[i]);
  save();
}

function newGame() {
  if (!confirm('Tüm skorlar silinip yeni oyun başlatılsın mı?')) return;
  state.scores = [0, 0, 0, 0];
  state.history = [];
  save();
}

function detail(idx) {
  const breakdown = {};
  Object.keys(META).forEach(k => breakdown[k] = 0);
  state.history.forEach(h => { breakdown[h.type] += (h.points[idx] || 0); });

  document.getElementById('modalbox').innerHTML = `
    <h2>📊 ${esc(state.names[idx])}</h2>
    ${Object.keys(META).map(k => `
      <div class="detailrow">
        <span>${META[k][0]}</span>
        <b class="${breakdown[k] < 0 ? 'neg' : 'pos'}">${breakdown[k] > 0 ? '+' : ''}${breakdown[k]}</b>
      </div>
    `).join('')}
    <div style="margin-top:14px;font-size:18px;font-weight:900;text-align:center">
      Toplam: <span class="${state.scores[idx] < 0 ? 'neg' : 'pos'}">${state.scores[idx]}</span>
    </div>
    <div class="actions"><button class="ghost" onclick="closeModal()">Kapat</button></div>
  `;
  document.getElementById('modal').classList.remove('hidden');
}

function finishScreen() {
  const ranked = state.names.map((n, i) => ({ n, s: state.scores[i] })).sort((a, b) => b.s - a.s);
  const total = state.scores.reduce((a, b) => a + b, 0);
  document.getElementById('modalbox').innerHTML = `
    <h2 style="text-align:center">🏆 Oyun Bitti</h2>
    ${ranked.map((p, i) => `
      <div class="detailrow">
        <span>${['🥇','🥈','🥉','4️⃣'][i]} ${esc(p.n)}</span>
        <b class="${p.s < 0 ? 'neg' : 'pos'}">${p.s}</b>
      </div>
    `).join('')}
    <div class="${total === 0 ? 'ok' : 'warn'}" style="margin-top:12px;text-align:center">
      ${total === 0 ? 'Puanlar tam denk (0).' : 'Puan denkliği uyuşmuyor: ' + total}
    </div>
    <div class="actions">
      <button class="ghost" onclick="closeModal()">Kapat</button>
      <button class="primary" onclick="newGame();closeModal()">Yeni Oyun</button>
    </div>
  `;
  document.getElementById('modal').classList.remove('hidden');
}

function settings() {
  document.getElementById('modalbox').innerHTML = `
    <h2>⚙️ İsimler ve Puanlar</h2>
    ${state.names.map((n, i) => `
      <label class="sub">Oyuncu ${i + 1}</label>
      <input id="nameInput${i}" value="${esc(n)}" style="margin-bottom:8px">
    `).join('')}
    <div class="actions">
      <button class="ghost" onclick="closeModal()">Vazgeç</button>
      <button class="primary" onclick="saveSettings()">Kaydet</button>
    </div>
  `;
  document.getElementById('modal').classList.remove('hidden');
}

function saveSettings() {
  state.names = [0, 1, 2, 3].map(i => document.getElementById('nameInput' + i).value.trim() || `Oyuncu ${i + 1}`);
  save();
  closeModal();
}

function closeModal() {
  document.getElementById('modal').classList.add('hidden');
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

render();
</script>
</body>
</html>
